name: tests
on: [push, pull_request]
jobs:
  python-only:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -m "not r"
  with-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages(c("lavaan","semTools"), repos="https://cloud.r-project.org")'
      - run: pip install -e ".[dev]"
      - run: twinval check-r
      - run: pytest
