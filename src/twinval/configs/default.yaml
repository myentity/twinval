# Default configuration of the twinval framework.
# Every threshold and resampling setting lives here so that an analysis can be
# pre-registered: copy this file, edit it, and pass it with `twinval run --config my.yaml`.
# Values below reproduce the settings of the original study (N = 484, 13 instruments).

run:
  name: run
  seed: 20260915                 # master seed; every stage derives its own generator from it
  n_jobs: 1

data:
  data_dir: data                 # folder with <scale_id>_paired_wide.csv files
  id_column: ID
  instruments: null              # e.g. [148, 157] to restrict to some instruments; null = all found in data_dir
  legacy_file_names: true        # also accept <legacy_id>_paired_wide.csv (original Russian file names)
  missing: drop                  # 'drop' incomplete pairs (complete-case across all loaded scales) | 'error'

thresholds:
  r_practical: 0.50              # practically adequate individuation: r >= 0.50 ...
  auc_ci_low: 0.50               # ... and lower 95% CI bound of scale-level AUC > 0.50
  cb_adequate: 0.80              # calibration adequate if C_b >= 0.80
  phi_congruence: 0.85           # Tucker's phi >= 0.85 => congruence supported
  bootstrap_valid_min: 0.80      # a Tucker bootstrap CI is stable if >= 80% replicates are admissible
  alpha_sig: 0.05
  # ---- invariance step decision: ALL of the following must hold
  cfa_delta_cfi_min: -0.010      # delta CFI (scaled) >= -0.010
  cfa_delta_rmsea_max: 0.015     # delta RMSEA (scaled) <= 0.015
  cfa_delta_srmr_loadings_max: 0.030    # delta SRMR <= 0.030 for steps that add loading constraints
  cfa_delta_srmr_thresholds_max: 0.010  # delta SRMR <= 0.010 for threshold / intercept (scalar) steps
  # ---- estimability of every CFA model
  cfa_pd_tolerance: 1.0e-6       # residual / latent covariance matrix not PD if its smallest eigenvalue < -tolerance
  cfa_bound_tolerance: 1.0e-6    # |standardised residual or latent correlation| > 1 + tolerance is inadmissible
  # ---- absolute fit of the baseline model (only when df > 0)
  cfa_srmr_fit_max: 0.08         # baseline fit supported if SRMR <= 0.08 (sensitivity: 0.05)
  cfa_fit_conflict_cfi_min: 0.90       # flag conflicting_fit_diagnostics: SRMR acceptable but CFI < 0.90 ...
  cfa_fit_conflict_rmsea_ci_lo_max: 0.10   # ... or lower 90% CI bound of RMSEA > 0.10
  # ---- diagnostic flags (warnings, not exclusions); fully standardised estimates
  near_boundary_loading: 0.95          # flag near_boundary_loading: |standardised loading| >= 0.95
  near_boundary_correlation: 0.95      # flag near_boundary_residual/latent_correlation: |r| >= 0.95

profile:
  enabled: true
  n_boot: 5000
  n_perm: 2000
  robustness_specs: true         # also compute Pearson / equal-weight-Pearson identification specs
  leave_one_instrument_out: true
  mahalanobis_scales: nonredundant   # nonredundant | all

scale:
  enabled: true
  n_boot: 5000
  n_perm: 2000
  cv_repeats: 10
  cv_folds: 5
  n_nested_boot: 1000            # nested person-level bootstrap around the CV recalibration
  n_boot_disattenuation: 5000

item:
  enabled: true
  n_boot: 5000
  n_boot_variance: 2000
  data_version: raw              # DATA USED FOR THE ITEM LEVEL: 'raw' = original categories (primary analysis of the study) |
                                 # 'harmonized' (sensitivity analysis; merged categories are re-numbered 1..k', so range-,
                                 # extreme- and entropy-based metrics refer to a coarser coding).
                                 # Harmonization merges rare categories symmetrically for Human and Twin when their observed
                                 # category sets differ for an item. Profile and scale level always use the raw input data;
                                 # CFA/ESEM always use harmonized data. The harmonized files are written to 00_audit/harmonized_data/.

structural:
  enabled: true                  # requires Rscript + lavaan + semTools
  rscript: Rscript
  cfa: true
  cfa_scales: all                # all | nonredundant (facets and total scores are redundant)
  esem: true
  order_check_permutations: 0    # >0: refit non-clean CFA models on this many random row orders to flag order-sensitive verdicts
  tucker_bootstrap: true
  bootstrap_admissible_only: true  # run the (slow) Tucker bootstrap only for instruments whose Human AND Twin ESEM are admissible
  n_boot_tucker: 500             # the published analysis used 500 (~11 h for 11 instruments)
  resume: true
  # ---- structural status S and typology rules
  primary_branch: wu             # wu (Wu & Estabrook 2016) | millsap (Millsap & Tein 2004 / Liu et al. 2017; sensitivity)
  use_delta_srmr: true           # sensitivity: false drops the delta-SRMR condition from the step decision
  exclude_near_boundary: false   # sensitivity: true treats models with near-boundary flags as not usable
  structural_priority: cfa       # cfa (CFA conclusion first, ESEM if CFA gives none) | esem (sensitivity)

synthesis:
  enabled: true
  n_boot_cluster: 5000
  min_clusters_for_cluster_bootstrap: 4   # with fewer instruments the cluster-bootstrap CI is reported as NaN
  type_labels:
    A: Score fidelity with measurement-invariance support
    B: Individuation without adequate calibration
    C: Limited individuation with structural evidence
    D: Score fidelity with structural discrepancy
    E: Score fidelity with limited structural evidence
    F: Unclassified residual
    cfa_misfit: Structural evidence not established (baseline CFA misfit)
    cfa_fit_not_testable: Structural evidence not established (baseline fit not testable)
    model_not_estimable: Structural model not estimable (nonconverged, not identified or inadmissible)
    not_tested: Structural analysis not conducted/not applicable

figures:
  dpi: 200

output:
  keep_intermediate: true      # false: delete copies of the input data (harmonised files, item batteries) from the run folder
