run:
  name: example_results
  seed: 20260915
  n_jobs: 1
data:
  data_dir: examples/data
  id_column: ID
  instruments: null
  legacy_file_names: true
  missing: drop
thresholds:
  r_practical: 0.5
  auc_ci_low: 0.5
  cb_adequate: 0.8
  ccc_acceptable: 0.4
  phi_congruence: 0.85
  bootstrap_valid_min: 0.8
  alpha_sig: 0.05
  cfa_delta_cfi_min: -0.01
  cfa_delta_rmsea_max: 0.015
  cfa_delta_srmr_loadings_max: 0.03
  cfa_delta_srmr_thresholds_max: 0.01
  cfa_pd_tolerance: 1.0e-06
  cfa_bound_tolerance: 1.0e-06
  cfa_srmr_fit_max: 0.08
  cfa_fit_conflict_cfi_min: 0.9
  cfa_fit_conflict_rmsea_ci_lo_max: 0.1
  near_boundary_loading: 0.95
  near_boundary_correlation: 0.95
profile:
  enabled: true
  n_boot: 5000
  n_perm: 2000
  robustness_specs: true
  leave_one_instrument_out: true
  mahalanobis_scales: nonredundant
scale:
  enabled: true
  n_boot: 5000
  n_perm: 2000
  cv_repeats: 10
  cv_folds: 5
  n_nested_boot: 1000
  n_boot_disattenuation: 5000
item:
  enabled: true
  n_boot: 5000
  n_boot_variance: 2000
  data_version: harmonized
structural:
  enabled: true
  rscript: Rscript
  cfa: true
  cfa_scales: all
  esem: true
  order_check_permutations: 5
  tucker_bootstrap: true
  bootstrap_admissible_only: true
  n_boot_tucker: 500
  resume: true
  rules_version: 2
  primary_branch: wu
  use_delta_srmr: true
  exclude_near_boundary: false
  structural_priority: cfa
synthesis:
  enabled: true
  n_boot_cluster: 5000
  min_clusters_for_cluster_bootstrap: 4
  type_labels:
    A: Score fidelity with measurement-invariance support
    B: Individuation without adequate calibration
    C: Limited individuation with structural evidence
    D: Score fidelity with structural discrepancy
    E: Score fidelity with limited structural evidence
    F: Unclassified residual
    cfa_misfit: Structural evidence not established (baseline CFA misfit)
    cfa_fit_not_testable: Structural evidence not established (baseline fit not testable)
    model_not_estimable: Structural model not estimable (nonconverged, not identified
      or inadmissible)
    not_tested: Structural analysis not conducted/not applicable
  type_labels_v1:
    A: Score fidelity with metric-level support
    B: Individuation without calibration
    C: Structural support without adequate individuation
    D: Score–structure discrepancy
    E: Score fidelity with limited structural support
    F: Unclassified residual
    model_inadmissible: Structural model inadmissible (Heywood/nonidentified)
    not_tested: Structural analysis not conducted/not applicable
figures:
  dpi: 200
output:
  keep_intermediate: false
