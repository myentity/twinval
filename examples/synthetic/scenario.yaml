# Scenario for `twinval simulate`: fictional instruments whose twins are built to behave differently.
#   intended  the type the design aims at (a design, not a guarantee); the pipeline recovers the type from the data alone
#   intended_v2  the same design under the rules_version 2 typology (only where it differs from `intended`)
#   design    what is built into the twin (see src/twinval/synth.py for all parameters)
#   seed      per-instrument seed. Instruments 905, 908, 909 and 910 rely on borderline numerical behaviour of the paired CFA
#             (non-convergence with identical twin answers); their seeds were chosen so that the intended outcome occurs -
#             with other seeds the same design gives other, equally legitimate results.
seed: 20260921
n_respondents: 500
factor_correlation: 0.3
instruments:
- id: 901
  key: SYN01
  name: Synthetic - Faithful twin
  response: [1, 5]
  scales:
  - name: Alpha
    n_items: 6
    intended: A
    design: high individuation, calibrated, same loadings
    twin: {rho: 0.88}
  - name: Beta
    n_items: 5
    intended: A
    design: high individuation, calibrated, same loadings
    twin: {rho: 0.85}
  - name: Gamma
    n_items: 6
    intended: A
    design: high individuation, calibrated, same loadings
    twin: {rho: 0.82}
- id: 902
  key: SYN02
  name: Synthetic - Miscalibrated twin
  response: [1, 7]
  scales:
  - name: Shifted
    n_items: 6
    intended: B
    design: good individuation, twin mean +0.7 SD and compressed
    twin: {rho: 0.88, mu: 0.7, sigma: 0.65}
  - name: Compressed
    n_items: 5
    intended: B
    design: good individuation, twin variance strongly compressed and mean +0.4 SD
    twin: {rho: 0.93, sigma: 0.4, mu: 0.4}
  - name: Lowered
    n_items: 6
    intended: B
    design: good individuation, twin mean -0.8 SD and never uses the highest category
    twin: {rho: 0.88, mu: -0.8, sigma: 0.75, never_highest: true}
- id: 903
  key: SYN03
  name: Synthetic - Weakly individuating twin
  response: [1, 5]
  scales:
  - name: Generic1
    n_items: 6
    intended: C
    design: same structure, twin only weakly tracks the person
    twin: {rho: 0.3}
  - name: Generic2
    n_items: 5
    intended: C
    design: same structure, twin only weakly tracks the person
    twin: {rho: 0.25}
  - name: Generic3
    n_items: 6
    intended: C
    design: same structure, twin only weakly tracks the person
    twin: {rho: 0.35}
- id: 904
  key: SYN04
  name: Synthetic - Unequal twin loadings
  response: [1, 5]
  scales:
  - name: Uneven1
    n_items: 6
    intended: E
    design: good, calibrated, but unequal twin loadings (no metric invariance)
    twin:
      rho: 0.88
      loading: [0.3, 0.9, 0.3, 0.9, 0.3, 0.9]
  - name: Uneven2
    n_items: 6
    intended: E
    design: good, calibrated, but unequal twin loadings (no metric invariance)
    twin:
      rho: 0.88
      loading: [0.9, 0.3, 0.9, 0.3, 0.9, 0.3]
  - name: Even
    n_items: 5
    intended: A
    design: control scale
    twin: {rho: 0.85}
- id: 905
  key: SYN05
  name: Synthetic - Repeated twin answers (congruent)
  response: [1, 5]
  seed: 7
  scales:
  - name: Duplicated
    n_items: 5
    intended: E
    design: 'twin repeats one answer on items 1-3: the scale-level CFA fails, ESEM is admissible and congruent (phi >= 0.85) -> limited structural support'
    twin:
      rho: 0.88
      duplicate:
      - [1, 2]
      - [1, 3]
      duplicate_corr: 1.0
  - name: Plain1
    n_items: 5
    intended: A
    design: control scale
    twin: {rho: 0.85}
  - name: Plain2
    n_items: 5
    intended: A
    design: control scale
    twin: {rho: 0.8}
- id: 906
  key: SYN06
  name: Synthetic - Mixed instrument with a total score
  response: [1, 6]
  total: {name: Total, scoring: sum}
  scales:
  - name: Mixed1
    n_items: 6
    reverse: [2, 4]
    intended: E
    design: 'good twin, but reverse-keyed items are handled worse (unequal loadings: no metric invariance)'
    twin: {rho: 0.85, reverse_loading_scale: 0.6}
  - name: Mixed2
    n_items: 5
    intended: B
    design: twin never uses the lowest category and is shifted
    twin: {rho: 0.85, mu: 0.8, sigma: 0.6, never_lowest: true}
  - name: Mixed3
    n_items: 5
    intended: C
    design: weak individuation
    twin: {rho: 0.3}
- id: 907
  key: SYN07
  name: Synthetic - Short scales
  response: [1, 5]
  scales:
  - name: ShortA
    n_items: 3
    intended: A
    design: 3 items, good twin
    twin: {rho: 0.85}
  - name: ShortB
    n_items: 3
    intended: C
    design: 3 items, weak individuation
    twin: {rho: 0.5}
  - name: ShortC
    n_items: 4
    intended: A
    design: 4 items
    twin: {rho: 0.85}
- id: 908
  key: SYN08
  name: Synthetic - Single-scale instrument
  response: [1, 5]
  scales:
  - name: Solo
    n_items: 4
    intended: not_tested
    intended_v2: model_not_estimable   # rules_version 2: a CFA that cannot be estimated is not 'not tested'
    design: 'unidimensional instrument (ESEM not applicable) whose twin gives one answer to all items: the CFA fails, so the structural level is unknown'
    twin:
      rho: 0.88
      duplicate:
      - [1, 2]
      - [1, 3]
      - [1, 4]
      duplicate_corr: 1.0
  seed: 1
- id: 909
  key: SYN09
  name: Synthetic - Repeated twin answers (discrepant)
  response: [1, 5]
  seed: 9
  scales:
  - name: DupD
    n_items: 5
    intended: D
    design: 'twin repeats one answer on items 1-3 and ignores items 4-5: good scale score, CFA fails, ESEM loadings differ (phi < 0.85)'
    twin:
      rho: 0.95
      loading: [0.9, 0.9, 0.9, 0.1, 0.1]
      duplicate:
      - [1, 2]
      - [1, 3]
      duplicate_corr: 1.0
  - name: DupF
    n_items: 5
    intended: F
    design: as DupD, but the twin also tracks the person poorly (r < 0.5, CCC < 0.4)
    twin:
      rho: 0.3
      loading: [0.9, 0.9, 0.9, 0.1, 0.1]
      duplicate:
      - [1, 2]
      - [1, 3]
      duplicate_corr: 1.0
  - name: Plain
    n_items: 5
    intended: A
    design: 'control scale (can come out as E by chance: a borderline metric-invariance test)'
    twin: {rho: 0.85}
- id: 910
  key: SYN10
  name: Synthetic - Repeated twin answers (inadmissible)
  response: [1, 5]
  seed: 1
  scales:
  - name: Duplicated
    n_items: 5
    intended: model_inadmissible
    intended_v2: model_not_estimable
    design: 'twin repeats one answer on items 1-3: CFA and the twin ESEM are inadmissible, the gate closes for the whole instrument'
    twin:
      rho: 0.88
      duplicate:
      - [1, 2]
      - [1, 3]
      duplicate_corr: 1.0
  - name: Plain1
    n_items: 5
    intended: A
    design: 'control scale (no Tucker phi: the instrument failed the gate)'
    twin: {rho: 0.85}
  - name: Plain2
    n_items: 5
    intended: A
    design: 'control scale (no Tucker phi: the instrument failed the gate)'
    twin: {rho: 0.8}
