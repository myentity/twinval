version: '2.0'
thresholds:
  r_practical: 0.5
  auc_ci_low: 0.5
  cb_adequate: 0.8
  ccc_acceptable: 0.4
  phi_congruence: 0.85
decision_order:
- model_inadmissible / not_tested (S unknown; separate categories)
- 'A: I adequate & C adequate & S in {scalar, metric}'
- 'B: I adequate & C distorted (evaluated before D)'
- 'C: I inadequate & S in {scalar, metric, configural, congruence}'
- 'D: (I adequate or CCC >= ccc_acceptable) & S == structurally_discrepant'
- 'E: I adequate & C adequate & S in {configural, congruence}'
- 'F: residual'
labels:
  A: Multidimensionally supported fidelity
  B: Individuating but miscalibrated
  C: Structurally supported but weakly individuating
  D: Structurally discrepant despite acceptable score-level fidelity
  E: Individuating and calibrated with limited structural support
  F: Unclassified residual
  model_inadmissible: Structural model inadmissible (Heywood/nonidentified)
  not_tested: Structural analysis not conducted/not applicable
